<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARPH24 - Plateforme Executive ARPE</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="executive-header">
            <div class="brand-section">
                <div class="logo-hexagon"><i class="fa-solid fa-microchip"></i></div>
                <div>
                    <h1 class="brand-title">ARPH24 <span class="badge-v2">PRO V3.5</span></h1>
                    <p class="brand-subtitle">Actif Représentant du Propriétaire d'Entreprise (ARPE)</p>
                </div>
            </div>
        </header>
        
        <main class="chat-input-area">
            <textarea id="promptInput" placeholder="Posez votre question..."></textarea>
            <button class="btn-glow" id="sendBtn">Envoyer</button>
        </main>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
